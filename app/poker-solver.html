<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>River Solver Table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>body{margin:0}</style>
</head>
<body>
<style>
/* Layout: a solver workbench. Left column is the table and the game tree, right column is the range grid and the solver. */
:root {
  --paper: #FCFCFB; --panel: #FFFFFF; --ink: #0B0B0B; --ink2: #52514E; --line: #E4E3DF; --soft: #F1F0EC;
  --bar: #0B0B0B; --bar-fg: #FCFCFB;
  --felt: #1F6B4A; --felt-hi: #2A8560; --felt-lo: #164E36; --rail: #4A2F1B; --rail-hi: #6B4529; --felt-fg: #FFFFFF;
  --card: #FFFFFF; --card-edge: #52514E; --back: #A0122A;
  --s-s: #0B0B0B; --s-h: #C8102E; --s-d: #1C5CAB; --s-c: #147A3A;
  --p0: #2A78D6; --p1: #EB6834;
  --a-fold: #4A78B5; --a-pass: #3A9A6B; --a-b1: #F2A07B; --a-b2: #D9573F; --a-b3: #8C1C24;
  --c-cfr: #2A78D6; --c-cfrp: #EB6834; --c-dcfr: #1BAF7A; --c-pcfr: #EDA100;
  --empty: #EEEEEE; --empty-fg: #A3A29D; --focus: #EDA100;
  --font: "Fira Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "Fira Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121413; --panel: #1A1D1B; --ink: #ECEBE7; --ink2: #A9A8A2; --line: #2E322F; --soft: #222624;
    --bar: #050606; --bar-fg: #FCFCFB; --card: #FDFDFC; --card-edge: #0B0B0B;
    --empty: #262A28; --empty-fg: #6F746F; --p0: #5B9BE6; --p1: #F0854F; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121413; --panel: #1A1D1B; --ink: #ECEBE7; --ink2: #A9A8A2; --line: #2E322F; --soft: #222624;
  --bar: #050606; --bar-fg: #FCFCFB; --card: #FDFDFC; --card-edge: #0B0B0B;
  --empty: #262A28; --empty-fg: #6F746F; --p0: #5B9BE6; --p1: #F0854F; color-scheme: dark;
}
html, body { background: var(--paper); }
body { color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.4; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.su { width: .78em; height: .78em; fill: currentColor; display: inline-block; vertical-align: -.06em; }
.pcard .su { width: 1em; height: 1em; vertical-align: 0; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* header bar, as the frame title of the slides */
.top { background: var(--bar); color: var(--bar-fg); }
.top-in { max-width: 1560px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
.top h1 { font-size: 19px; font-weight: 600; margin: 0; letter-spacing: .01em; }
.top .spot { font-size: 13px; opacity: .8; flex: 1 1 200px; min-width: 0; }
.top .btn { background: transparent; color: var(--bar-fg); border: 1px solid rgba(252,252,251,.45); }
.top .btn:hover { background: rgba(252,252,251,.14); }
.wrap { max-width: 1560px; margin: 0 auto; padding-block: 14px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
@media (max-width: 1020px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; min-width: 0; }
.panel > h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; }
.panel > h2 .h2r { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; text-transform: none; letter-spacing: 0; font-weight: 400; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 5px 11px; font-size: 13px; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); font-weight: 600; }
.btn.primary:hover { opacity: .86; background: var(--ink); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink2); }
label.f input, label.f select, .inp { border: 1px solid var(--line); background: var(--paper); border-radius: 5px; padding: 5px 8px; font-size: 13px; color: var(--ink); min-width: 0; }
.muted { color: var(--ink2); }
.hint { font-size: 12.5px; color: var(--ink2); margin: 8px 0 0; max-width: 70ch; }

/* setup */
.setup summary { cursor: pointer; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.setup[open] summary { margin-bottom: 12px; }
.setup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 14px; align-items: end; }
.setup-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }

/* the table: the green felt of slide 4, drawn as a real table with a rail */
.table-wrap { width: 100%; --cw: clamp(30px, 6.3cqw, 54px); container-type: inline-size; }
.rail { aspect-ratio: 2.05 / 1; border-radius: 999px; padding: clamp(8px, 2.2cqw, 18px);
  background: linear-gradient(160deg, var(--rail-hi), var(--rail) 55%, #2B1A0E); box-shadow: 0 6px 18px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.18); }
.felt { position: relative; width: 100%; height: 100%; border-radius: 999px; color: var(--felt-fg);
  background: radial-gradient(ellipse at 50% 42%, var(--felt-hi), var(--felt) 58%, var(--felt-lo)); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35), inset 0 10px 28px rgba(0,0,0,.35); }
.felt::before { content: ""; position: absolute; inset: 5.5%; border-radius: 999px; border: 1.5px solid rgba(255,255,255,.16); pointer-events: none; }
.board { position: absolute; left: 50%; top: 31%; transform: translate(-50%, -50%); display: flex; gap: calc(var(--cw) * .12); }
.potline { position: absolute; left: 50%; top: 53%; transform: translate(-50%, -50%); font-size: clamp(11px, 2.5cqw, 17px); white-space: nowrap; text-align: center; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
.result { position: absolute; left: 50%; top: 9.5%; transform: translate(-50%, -50%); font-size: clamp(10px, 2.1cqw, 14px); font-weight: 600; background: rgba(0,0,0,.45); padding: 2px 12px; border-radius: 99px; white-space: nowrap; }
.seat { position: absolute; bottom: 7%; display: flex; flex-direction: column; align-items: center; gap: 3px; width: 34%; }
.seat0 { left: 9%; } .seat1 { right: 9%; }
.hole { display: flex; gap: calc(var(--cw) * .1); cursor: pointer; border-radius: 6px; padding: 2px; background: none; border: 0; }
.hole:hover { background: rgba(255,255,255,.14); }
.seat .lbl { font-size: clamp(9.5px, 2cqw, 13.5px); white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.4); display: flex; gap: 6px; align-items: center; }
.seat .stack { opacity: .85; font-variant-numeric: tabular-nums; }
.seat.acting .lbl .nm { background: var(--focus); color: #0B0B0B; border-radius: 99px; padding: 0 8px; text-shadow: none; font-weight: 600; }
.dealer { width: 1.5em; height: 1.5em; border-radius: 50%; background: #FDFDFC; color: #0B0B0B; font-size: .8em; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; text-shadow: none; box-shadow: 0 1px 2px rgba(0,0,0,.5); }
.wager { position: absolute; top: 31%; transform: translateY(-50%); width: 21%; flex-direction: column; justify-content: center; font-size: clamp(9.5px, 2cqw, 13.5px); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.wager0 { left: 6%; } .wager1 { right: 6%; }
.wager > span { display: inline-flex; align-items: center; gap: 4px; }
@container (max-width: 560px) { .rail { aspect-ratio: 1.5 / 1; } .board { top: 26%; } .potline { top: 47%; } .wager { top: 26%; width: 17%; left: 2%; } .wager1 { left: auto; right: 2%; } .seat0 { left: 5%; } .seat1 { right: 5%; } .seat { width: 42%; } }
.chip { width: 1.15em; height: 1.15em; border-radius: 50%; background: var(--focus); border: 2px dashed rgba(255,255,255,.9); box-shadow: 0 1px 2px rgba(0,0,0,.5); display: inline-block; }
.said { background: rgba(0,0,0,.5); border-radius: 99px; padding: 1px 9px; font-weight: 600; }
.pcard { width: var(--cw); height: calc(var(--cw) * 1.39); border-radius: calc(var(--cw) * .11); background: var(--card); border: 1px solid var(--card-edge);
  display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 700; line-height: 1; padding: 0; box-shadow: 0 1px 3px rgba(0,0,0,.35); font-family: var(--font); }
.pcard .r { font-size: calc(var(--cw) * .5); } .pcard .u { font-size: calc(var(--cw) * .46); margin-top: calc(var(--cw) * .02); }
button.pcard:hover { transform: translateY(-2px); }
.pcard.back { background: var(--back); border: 2px solid #FDFDFC; }
.pcard.sm { --cw: 24px; box-shadow: none; }
.c-s { color: var(--s-s); } .c-h { color: var(--s-h); } .c-d { color: var(--s-d); } .c-c { color: var(--s-c); }
.pcard.c-s, .pcard.c-h, .pcard.c-d, .pcard.c-c { background: var(--card); }
.pcard.c-s { color: #0B0B0B; } .pcard.c-h { color: #C8102E; } .pcard.c-d { color: #1C5CAB; } .pcard.c-c { color: #147A3A; }

/* line and actions */
.crumbs { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; margin-top: 12px; font-size: 13px; }
.crumbs button { border: 0; background: none; padding: 2px 6px; border-radius: 4px; color: var(--ink2); }
.crumbs button:hover { background: var(--soft); color: var(--ink); }
.crumbs button.cur { color: var(--ink); font-weight: 600; }
.crumbs .sep { color: var(--ink2); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.act { flex: 1 1 108px; min-width: 0; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 7px 10px 8px; text-align: left; position: relative; overflow: hidden; }
.act:hover { border-color: var(--ink2); }
.act .sw { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; }
.act .nm { font-weight: 600; padding-left: 6px; display: block; }
.act .fq { padding-left: 6px; font-size: 12.5px; color: var(--ink2); display: block; font-variant-numeric: tabular-nums; }
.act .meter { position: absolute; left: 0; bottom: 0; height: 3px; }
.undernote { font-size: 13px; margin: 10px 0 0; max-width: 78ch; }
.undernote b { font-weight: 600; }
.rowbtns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

/* range grid */
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid var(--line); border-bottom-width: 3px; background: var(--paper); padding: 5px 12px; border-radius: 5px 5px 0 0; font-size: 13px; font-weight: 600; display: flex; gap: 7px; align-items: center; }
.tab .dot { width: 9px; height: 9px; border-radius: 50%; }
.tab[aria-selected="true"] { background: var(--panel); border-bottom-color: var(--ink); }
.tab .sub { font-weight: 400; color: var(--ink2); font-size: 12px; }
.gridbox { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 232px); gap: 12px; margin-top: 10px; align-items: start; }
@media (max-width: 620px) { .gridbox { grid-template-columns: minmax(0, 1fr); } }
.grid { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 1.5px; container-type: inline-size; user-select: none; touch-action: manipulation; }
.cell { position: relative; aspect-ratio: 1; background: var(--empty); overflow: hidden; border-radius: 2px; }
.cell .fill { position: absolute; left: 0; right: 0; bottom: 0; display: flex; }
.cell .fill i { display: block; height: 100%; }
.cell .t { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(6.5px, 2.25cqw, 12.5px); font-weight: 500; color: var(--empty-fg); pointer-events: none; }
.cell.on .t { color: #FFFFFF; text-shadow: 0 0 2px rgba(0,0,0,.55); }
.cell.sel { outline: 2.5px solid var(--focus); outline-offset: -1px; z-index: 2; }
.cell.hl { outline: 2.5px solid var(--ink); outline-offset: -1px; z-index: 2; }
.grid.edit .cell { cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legend i { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.rangebar { display: flex; height: 12px; border-radius: 3px; overflow: hidden; margin-top: 8px; background: var(--empty); gap: 2px; }
.rangebar i { display: block; height: 100%; }
.detail { font-size: 12.5px; min-width: 0; }
.detail h3 { font-size: 14px; margin: 0 0 4px; font-weight: 600; }
.detail table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.detail td, .detail th { padding: 2px 3px; text-align: right; border-bottom: 1px solid var(--line); font-weight: 400; white-space: nowrap; }
.detail th { color: var(--ink2); font-size: 11px; }
.detail td:first-child, .detail th:first-child { text-align: left; }
.detail tr.pick { cursor: pointer; } .detail tr.pick:hover td { background: var(--soft); }
.detail .mini { display: inline-flex; width: 46px; height: 9px; border-radius: 2px; overflow: hidden; vertical-align: middle; background: var(--empty); }
.detail .mini i { display: block; height: 100%; }
.editbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
.editbar textarea { flex: 1 1 100%; min-height: 54px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); padding: 6px 8px; font-family: var(--mono); font-size: 12px; resize: vertical; }

/* tree and chart */
.treebox { overflow-x: auto; }
.treebox svg { display: block; margin: 0 auto; }
.tree text { font-family: var(--font); }
.tree .edge { stroke: var(--ink2); fill: none; opacity: .5; }
.tree .edge.on { stroke: var(--ink); opacity: 1; }
.tree .elab { font-size: 10.5px; fill: var(--ink2); paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
.tree .elab.on { fill: var(--ink); font-weight: 600; }
.tree .nd { cursor: pointer; }
.tree .nd text { font-size: 9.5px; font-weight: 700; fill: #FFFFFF; pointer-events: none; }
.tree .nd.leaf rect { fill: var(--soft); stroke: var(--ink2); }
.tree .nd.leaf text { fill: var(--ink); font-weight: 600; }
.tree .nd.cur .ring { stroke: var(--focus); stroke-width: 3.5; fill: none; }
.tree .nd.off { opacity: .5; }
.solvebar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: end; }
.status { margin: 10px 0 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.status b { font-weight: 600; }
.chartbox { margin-top: 8px; position: relative; }
.chart text { font-family: var(--font); font-size: 11px; fill: var(--ink2); }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { stroke: var(--ink2); stroke-width: 1; }
.chart .ser { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .endlab { font-size: 11.5px; font-weight: 600; fill: var(--ink); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); white-space: nowrap; z-index: 5; font-variant-numeric: tabular-nums; }
.tip i { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: middle; }
.racetab { border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; margin-top: 8px; width: 100%; }
.racetab td, .racetab th { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; font-weight: 400; }
.racetab th { color: var(--ink2); font-size: 11.5px; }
.racetab td:first-child, .racetab th:first-child { text-align: left; }
.racetab i { display: inline-block; width: 14px; height: 3px; margin-right: 7px; vertical-align: middle; }

/* card picker and guide */
.pop { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.pop .box { background: var(--panel); border-radius: 8px; padding: 16px; max-width: 100%; box-shadow: 0 12px 40px rgba(0,0,0,.4); border: 1px solid var(--line); }
.pop h3 { margin: 0 0 10px; font-size: 15px; }
.pick { display: grid; grid-template-columns: repeat(13, minmax(0, 1fr)); gap: 4px; --cw: clamp(19px, 5.6vw, 36px); }
.pick .pcard:disabled { opacity: .18; cursor: default; transform: none; }
.pick .pcard.chosen { outline: 3px solid var(--focus); }
.guide { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--panel); border-left: 1px solid var(--line); box-shadow: -8px 0 30px rgba(0,0,0,.25); z-index: 40; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.guide header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.guide header h2 { margin: 0; font-size: 16px; }
.guide ol { list-style: none; margin: 0; padding: 8px 16px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.guide li { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.guide li.done { border-color: var(--a-pass); }
.guide li h3 { margin: 0 0 4px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.guide li h3 .n { color: var(--ink2); font-weight: 400; font-variant-numeric: tabular-nums; }
.guide li p { margin: 0 0 8px; font-size: 13px; color: var(--ink2); }
@media (prefers-reduced-motion: no-preference) { button.pcard { transition: transform .08s; } }
</style>
<div class="top"><div class="top-in">
  <h1>River Solver Table</h1>
  <div class="spot" id="spotline"></div>
  <button class="btn" id="btnGuide" type="button">Demo guide</button>
</div></div>

<div class="wrap">
  <details class="panel setup" id="setup">
    <summary>Set up the spot</summary>
    <div class="setup-grid">
      <label class="f">Name of the first player to act<input id="name0" autocomplete="off"></label>
      <label class="f">Name of the player in position<input id="name1" autocomplete="off"></label>
      <label class="f">Pot at the start of the river<input id="pot" type="number" min="1" step="1"></label>
      <label class="f">Stack behind for each player<input id="stack" type="number" min="1" step="1"></label>
      <label class="f">First player's bet sizes, percent of pot<input id="bets0" autocomplete="off"></label>
      <label class="f">In-position bet sizes, percent of pot<input id="bets1" autocomplete="off"></label>
      <label class="f">Raise sizes, percent of pot<input id="raises" autocomplete="off"></label>
      <label class="f">Most bets and raises in a line<select id="maxRaises"><option>1</option><option>2</option><option>3</option></select></label>
    </div>
    <div class="setup-row">
      <button class="btn" id="btnTalk" type="button">Load the talk example</button>
      <button class="btn" id="btnRandomBoard" type="button">Random board</button>
      <button class="btn" id="btnSwap" type="button">Swap the two seats</button>
      <span class="muted">An all-in is always allowed. Click a board card on the table to change it.</span>
    </div>
  </details>

  <div class="cols">
    <div class="col">
      <section class="panel">
        <h2>The table <span class="h2r"><button class="btn small" id="btnDeal" type="button">Deal hands from the ranges</button><button class="btn small" id="btnHide" type="button">Hide hands</button></span></h2>
        <div class="table-wrap"><div class="rail"><div class="felt">
          <div class="result" id="result" hidden></div>
          <div class="board" id="board"></div>
          <div class="potline" id="potline"></div>
          <div class="wager wager0" id="wager0"></div>
          <div class="wager wager1" id="wager1"></div>
          <div class="seat seat0" id="seat0"></div>
          <div class="seat seat1" id="seat1"></div>
        </div></div></div>
        <div class="crumbs" id="crumbs"></div>
        <div class="actions" id="actions"></div>
        <p class="undernote" id="undernote"></p>
        <div class="rowbtns">
          <button class="btn" id="btnBack" type="button">Back one action</button>
          <button class="btn" id="btnRestart" type="button">Back to the start</button>
          <button class="btn" id="btnSample" type="button">Let the solver act</button>
        </div>
      </section>
      <section class="panel">

<script>

  function renderEditBar() {

  // ---------- game tree ----------
  function renderTree() {
    const g = S.g, box = $('treebox'), onPath = new Set(), inSub = new Set();
    for (let n = S.node; n; n = n.parent) onPath.add(n.id);
    (function mark(n) { inSub.add(n.id); if (n.children) n.children.forEach(mark); })(S.node);
    const all = S.treeMode === 'all';
    const expanded = n => n.type === 'd' && (all || inSub.has(n.id) || (onPath.has(n.id) && n !== S.node) || n === S.node);
    let row = 0, maxD = 0; const items = [];
    (function lay(n, d) {
      const it = { n, d, kids: [] }; items.push(it); maxD = Math.max(maxD, d);
      if (expanded(n)) it.kids = n.children.map(c => lay(c, d + 1));
      it.y = it.kids.length ? (it.kids[0].y + it.kids[it.kids.length - 1].y) / 2 : row++;
      return it;
    })(g.root, 0);
    const RH = 25, L = 18, Rm = 150, cw = Math.max(104, Math.min(190, ((box.clientWidth || 640) - L - Rm) / Math.max(1, maxD)));
    const W = L + Rm + cw * maxD, H = row * RH + 14, X = it => L + it.d * cw, Y = it => 16 + it.y * RH;
    let edges = '', nodes = '';
    for (const it of items) {
      const n = it.n, x = X(it), y = Y(it), on = onPath.has(n.id);
      it.kids.forEach((k, a) => {
        const x2 = X(k), y2 = Y(k), eo = onPath.has(k.n.id), pr = S.prob[k.n.id], mx = x + (x2 - x) * 0.45;
        edges += `<path class="edge${eo ? ' on' : ''}" d="M${x},${y} C${mx},${y} ${mx},${y2} ${x2 - 10},${y2}" stroke-width="${(1 + 5 * Math.sqrt(Math.max(pr, 0))).toFixed(2)}"/>`;
        edges += `<text class="elab${eo ? ' on' : ''}" x="${x2 - 13}" y="${y2 - 5}" text-anchor="end">${esc(actShort(n.actions[a]))} · ${pct(actFreq(n, a), 0)}</text>`;
      });
      const cur = n === S.node ? ' cur' : '', off = S.prob[n.id] < 1e-4 ? ' off' : '';
      if (n.type === 'd') {
        const stub = !it.kids.length;
        nodes += `<g class="nd${cur}${off}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(nm(n.player))} to act"><circle cx="${x}" cy="${y}" r="8" fill="var(--p${n.player})"/>${stub ? `<text x="${x}" y="${y + 3.5}" text-anchor="middle">+</text>` : ''}${cur ? `<circle class="ring" cx="${x}" cy="${y}" r="11.5"/>` : ''}</g>`;
      } else {
        const lab = n.type === 'fold' ? `${nm(1 - n.folder).slice(0, 14)} wins ${fmt(potNow(n))}` : `showdown for ${fmt(potNow(n))}`;
        nodes += `<g class="nd leaf${cur}${off}" data-id="${n.id}" tabindex="0" role="button"><rect x="${x - 6}" y="${y - 6}" width="12" height="12" rx="2"/>${cur ? `<circle class="ring" cx="${x}" cy="${y}" r="11.5"/>` : ''}<text x="${x + 12}" y="${y + 3.5}" style="font-size:10.5px;font-weight:${on ? 600 : 400}">${esc(lab)}</text></g>`;
      }
    }
    box.innerHTML = `<svg class="tree" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Game tree of the river">${edges}${nodes}</svg>`;
    $('btnTreeAll').setAttribute('aria-pressed', all); $('btnTreeLine').setAttribute('aria-pressed', !all);
    const nl = g.nodes.length - g.decisions.length;
    $('treehint').innerHTML = `<span style="color:var(--p0)">●</span> ${esc(nm(0))} decides &nbsp; <span style="color:var(--p1)">●</span> ${esc(nm(1))} decides &nbsp; ▫ the hand ends. The whole river has ${g.decisions.length} decision points and ${nl} endings. Thicker branches are played more often, and the ring marks where the table is now. Click any point to jump there.`;
  }

  // ---------- convergence chart ----------
  let chartGeom = null;
  function renderChart() {
    const box = $('chartbox'), W = Math.max(300, box.clientWidth || 600), H = 250, m = { l: 50, r: 62, t: 12, b: 34 };
    const series = ALGO_KEYS.map(a => ({ a, s: S.solvers[a] })).filter(o => o.s.hist.length);
    const potp = e => Math.max(1e-9, 100 * e / S.g.pot);
    if (!series.length) { box.innerHTML = '<p class="muted" style="margin:0">Press Solve to run one algorithm, or Race all four to compare them on this spot.</p>'; $('racetab').innerHTML = ''; renderStatus(); chartGeom = null; return; }
    let tmax = 10, lo = Infinity, hi = -Infinity;
    for (const o of series) for (const [t, e] of o.s.hist) { tmax = Math.max(tmax, t); lo = Math.min(lo, potp(e)); hi = Math.max(hi, potp(e)); }
    const x1 = Math.log10(tmax), y0 = Math.floor(Math.log10(lo) + 1e-9), y1 = Math.max(y0 + 1, Math.ceil(Math.log10(hi) - 1e-9));
    const X = t => m.l + (W - m.l - m.r) * Math.log10(t) / x1, Y = v => m.t + (H - m.t - m.b) * (y1 - Math.log10(v)) / (y1 - y0);
    let s = '';
    const step = Math.max(1, Math.ceil((y1 - y0) / 6));
    for (let d = y0; d <= y1; d += step) { const y = Y(Math.pow(10, d)); s += `<line class="gl" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text x="${m.l - 6}" y="${y + 4}" text-anchor="end">${d >= 0 ? Math.pow(10, d) : Math.pow(10, d).toFixed(-d)}%</text>`; }
    for (let d = 0; d <= x1 + 1e-9; d++) { const x = X(Math.pow(10, d)); s += `<line class="gl" x1="${x}" x2="${x}" y1="${m.t}" y2="${H - m.b}"/><text x="${x}" y="${H - m.b + 15}" text-anchor="middle">${Math.pow(10, d).toLocaleString('en-US')}</text>`; }
    s += `<line class="ax" x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}"/><text x="${(m.l + W - m.r) / 2}" y="${H - 3}" text-anchor="middle">iterations</text>`;
    const ends = [];
    for (const o of series) {
      s += `<path class="ser" stroke="${ALGO_VAR[o.a]}" d="${o.s.hist.map(([t, e], i) => (i ? 'L' : 'M') + X(t).toFixed(1) + ',' + Y(potp(e)).toFixed(1)).join('')}"/>`;
      const last = o.s.hist[o.s.hist.length - 1]; ends.push({ a: o.a, x: X(last[0]), y: Y(potp(last[1])) });
    }
    ends.sort((p, q) => p.y - q.y); for (let i = 1; i < ends.length; i++) if (ends[i].y - ends[i - 1].y < 13) ends[i].ly = (ends[i - 1].ly || ends[i - 1].y) + 13;
    for (const e of ends) s += `<circle cx="${e.x}" cy="${e.y}" r="3.5" fill="${ALGO_VAR[e.a]}" stroke="var(--panel)" stroke-width="1.5"/><text class="endlab" x="${e.x + 8}" y="${(e.ly || e.y) + 4}">${P.ALGOS[e.a]}</text>`;
    s += `<line id="xh" class="ax" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" visibility="hidden"/>`;
    box.innerHTML = `<div class="muted" style="font-size:12.5px;margin-bottom:2px">How far the average strategy is from equilibrium, as a percentage of the pot. Both axes are logarithmic.</div><svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Exploitability against iterations for each algorithm">${s}</svg><div class="tip" id="tip" hidden></div>`;
    chartGeom = { W, m, x1, series };
    $('racetab').innerHTML = '<tr><th>Algorithm</th><th>Iterations</th><th>Exploitability, chips</th><th>Percent of pot</th><th>Seconds</th></tr>' + series.map(o => {
      const [t, e] = o.s.hist[o.s.hist.length - 1];
      return `<tr><td><i style="background:${ALGO_VAR[o.a]}"></i>${P.ALGOS[o.a]}</td><td>${t.toLocaleString('en-US')}</td><td>${sci(e)}</td><td>${sci(100 * e / S.g.pot)}%</td><td>${(o.s.time / 1000).toFixed(1)}</td></tr>`;
    }).join('');
    renderStatus();
  }
  function chartHover(ev) {
    const tip = $('tip'), xh = document.getElementById('xh'); if (!chartGeom || !tip) return;
    const svg = $('chartbox').querySelector('svg'), rect = svg.getBoundingClientRect(), { W, m, x1, series } = chartGeom;
    const px = ev.clientX - rect.left;
    if (ev.type === 'pointerleave' || px < m.l || px > W - m.r + 4) { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); return; }

    let rows = '', tt = 0;
    for (const o of series) { let best = o.s.hist[0]; for (const pnt of o.s.hist) if (Math.abs(Math.log(pnt[0] / t)) < Math.abs(Math.log(best[0] / t))) best = pnt;
      tt = Math.max(tt, best[0]); rows += `<div><i style="background:${ALGO_VAR[o.a]}"></i>${P.ALGOS[o.a]} at ${best[0]}: <b>${sci(100 * best[1] / S.g.pot)}%</b></div>`; }
    tip.innerHTML = rows; tip.hidden = false;
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    const boxR = $('chartbox').getBoundingClientRect(); let left = px + 14; if (left + tip.offsetWidth > boxR.width) left = px - tip.offsetWidth - 10;

  function renderStatus() {

  function renderAll() { renderTable(); renderCrumbs(); renderActions(); renderTabs(); renderEditBar(); renderGrid(); renderDetail(); renderTree(); renderStatus(); }

  // ---------- card picker ----------
  let pick = null;
  function openPicker(kind, idx) {
    const g = S.g, taken = new Set();
    if (kind === 'board') S.cfg.board.forEach((c, i) => { if (i !== idx) taken.add(c); });
    else { S.cfg.board.forEach(c => taken.add(c)); const o = S.hole[1 - idx]; if (o >= 0) { taken.add(g.ca[o]); taken.add(g.cb[o]); } }
    pick = { kind, idx, taken, chosen: [] };
    $('popTitle').textContent = kind === 'board' ? 'Choose the new board card' : `Choose two cards for ${nm(idx)}`;
    $('popRandom').hidden = kind === 'board';
    drawPicker(); $('pop').hidden = false;
  }
  function drawPicker() {
    let html = '';
    for (const s of [3, 2, 1, 0]) for (let r = 12; r >= 0; r--) { const c = r * 4 + s; html += cardHtml(c, 'button', pick.chosen.indexOf(c) >= 0 ? 'chosen' : '').replace('data-c=', (pick.taken.has(c) ? 'disabled ' : '') + 'data-c='); }
    $('pick').innerHTML = html;
  }
  function pickCard(c) {
    if (pick.kind === 'board') { S.cfg.board[pick.idx] = c; closePicker(); buildGame(true); return; }
    if (pick.chosen.indexOf(c) >= 0) pick.chosen = pick.chosen.filter(x => x !== c); else pick.chosen.push(c);
    if (pick.chosen.length === 2) { const [a, b] = pick.chosen.sort((x, y) => x - y), g = S.g; let h = -1; for (let i = 0; i < g.N; i++) if (g.ca[i] === a && g.cb[i] === b) { h = i; break; }
      S.hole[pick.idx] = h; S.tab = pick.idx; closePicker(); renderAll(); } else drawPicker();
  }
  function closePicker() { $('pop').hidden = true; pick = null; }
  function sample(w) { let tot = 0; for (let i = 0; i < w.length; i++) tot += w[i]; let u = Math.random() * tot; for (let i = 0; i < w.length; i++) { u -= w[i]; if (u <= 0 && w[i] > 0) return i; } return -1; }
  const shares = (a, b) => { const g = S.g; return g.ca[a] === g.ca[b] || g.ca[a] === g.cb[b] || g.cb[a] === g.ca[b] || g.cb[a] === g.cb[b]; };
  function dealRandom() {
    const g = S.g; if (!(g.Z > 0)) return;
    for (let k = 0; k < 500; k++) { const a = sample(g.w[0]), b = sample(g.w[1]); if (a >= 0 && b >= 0 && !shares(a, b)) { S.hole = [a, b]; break; } }
    goNode(g.root);
  }
  function solverActs() {
    const n = S.node; if (n.type !== 'd') return;
    const p = n.player, h = S.hole[p], w = new Float64Array(n.na);
    const own = h >= 0 && S.view[n.id].reach[p][h] > 1e-9;
    for (let a = 0; a < n.na; a++) w[a] = own ? S.strat[n.di][h * n.na + a] : Math.max(0, actFreq(n, a) || 0);
    const a = sample(w); act(a >= 0 ? a : 0);
  }
  function setHand(p, str) { const a = P.cardOf(str.slice(0, 2)), b = P.cardOf(str.slice(2, 4)), lo = Math.min(a, b), hi = Math.max(a, b), g = S.g;
    for (let i = 0; i < g.N; i++) if (g.ca[i] === lo && g.cb[i] === hi) { S.hole[p] = i; return; } }
  function goLine(labels) { let n = S.g.root; for (const l of labels) { const i = n.actions.findIndex(a => actShort(a) === l || a.kind === l); if (i < 0) break; n = n.children[i]; } goNode(n); }

  function mixedClass() {

      const g = S.g; for (const h of S.classHands[k]) g.w[S.tab][h] = S.brush; renderGrid(); };
    grid.addEventListener('pointerdown', e => { const k = cellAt(e); if (k < 0) return;
      if (S.edit) { painting = true; stopJob(); paint(k); e.preventDefault(); } else { S.sel = S.sel === k ? -1 : k; S.hover = -1; renderGrid(); renderDetail(); } });
    grid.addEventListener('pointermove', e => { const k = cellAt(e); if (S.edit) { if (painting) paint(k); } else if (e.pointerType === 'mouse' && k !== S.hover) { S.hover = k; renderDetail(); } });
    grid.addEventListener('pointerleave', () => { if (S.hover >= 0) { S.hover = -1; renderDetail(); } });
    window.addEventListener('pointerup', () => { if (painting) { painting = false; if (dirty) { dirty = false; $('rangeText').value = P.rangeToString(S.cfg.weights[S.tab]); scheduleRebuild(); } } });
    $('detail').addEventListener('click', e => { const r = e.target.closest('[data-h]'); if (!r) return; const h = +r.dataset.h, o = S.hole[1 - S.tab]; if (o >= 0 && shares(h, o)) S.hole[1 - S.tab] = -1; S.hole[S.tab] = h; renderAll(); });
    $('btnEdit').onclick = () => { S.edit = !S.edit; S.sel = -1; renderAll(); };
    $('brushes').addEventListener('click', e => { const b = e.target.closest('[data-b]'); if (b) { S.brush = +b.dataset.b; renderEditBar(); } });
    $('preset').onchange = e => { if (e.target.value === '') return; S.cfg.weights[S.tab] = P.parseRange(PRESETS[+e.target.value][1]); e.target.value = ''; const t = S.tab; buildGame(true); S.tab = t; S.edit = true; renderAll(); };
    $('btnClear').onclick = () => { S.cfg.weights[S.tab] = new Float64Array(169); const t = S.tab; buildGame(false); S.tab = t; S.edit = true; renderAll(); };
    $('btnApplyText').onclick = () => { S.cfg.weights[S.tab] = P.parseRange($('rangeText').value); const t = S.tab; buildGame(true); S.tab = t; S.edit = true; renderAll(); };
    // tree
    const treeGo = e => { const n = e.target.closest('[data-id]'); if (n) { const node = S.g.nodes[+n.dataset.id]; if (node.type === 'd') S.tab = node.player; goNode(node); } };
    $('treebox').addEventListener('click', treeGo);
    $('treebox').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); treeGo(e); } });
    $('btnTreeAll').onclick = () => { S.treeMode = 'all'; renderTree(); };
    $('btnTreeLine').onclick = () => { S.treeMode = 'line'; renderTree(); };
    // solver
    $('algo').onchange = e => { S.algo = e.target.value; refreshView(); renderAll(); renderStatus(); };
    $('target').onchange = e => { S.target = Math.max(10, Math.min(20000, parseInt(e.target.value, 10) || 1000)); e.target.value = S.target; };
    $('btnSolve').onclick = () => { const s = S.solvers[S.algo]; startJob([S.algo], s.t >= S.target ? s.t + S.target : S.target); };
    $('btnRace').onclick = () => { const tm = Math.max(S.target, ...ALGO_KEYS.map(a => S.solvers[a].t)); startJob(ALGO_KEYS.slice(), tm); };
    $('btnStop').onclick = () => { stopJob(); refreshView(); renderAll(); renderChart(); };
    $('btnReset').onclick = () => { stopJob(); for (const a of ALGO_KEYS) S.solvers[a] = new P.Solver(S.g, a); refreshView(); renderAll(); renderChart(); };
    $('chartbox').addEventListener('pointermove', chartHover); $('chartbox').addEventListener('pointerleave', chartHover);
    // setup
    for (const id of ['pot', 'stack', 'bets0', 'bets1', 'raises', 'maxRaises']) $(id).addEventListener('change', readSetup);
    for (const p of [0, 1]) $('name' + p).addEventListener('input', e => { S.cfg.names[p] = e.target.value.slice(0, 24); renderAll(); });
    $('btnTalk').onclick = () => { S.cfg = talkCfg(); fillSetup(); buildGame(true); };
    $('btnRandomBoard').onclick = () => { const d = Array.from({ length: 52 }, (_, i) => i); for (let i = 51; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; } S.cfg.board = d.slice(0, 5); buildGame(true); };
    $('btnSwap').onclick = () => { const c = S.cfg; c.names.reverse(); c.weights.reverse(); c.bets.reverse(); fillSetup(); buildGame(true); };
    // guide
    $('btnGuide').onclick = () => { $('guide').hidden = !$('guide').hidden; };
    $('btnGuideClose').onclick = () => { $('guide').hidden = true; };
    $('guideList').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (!b) return; S.edit = false; GUIDE[+b.dataset.s][2](); b.closest('li').classList.add('done'); if (window.innerWidth < 900) $('guide').hidden = true; });
    let rz = 0; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { renderTree(); renderChart(); }, 150); });
    buildGame(true);
  }
  window.RiverTable = { S, goLine, setHand, startJob };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
</html>
